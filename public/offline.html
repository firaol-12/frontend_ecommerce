<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're offline</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex;
           align-items: center; justify-content: center; text-align: center; padding: 24px;
           background: #f7f8fa; color: #222; }
    .box { max-width: 340px; }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    p { color: #666; line-height: 1.5; }
    button, a.btn { display: inline-block; margin: 6px 4px 0; padding: 12px 20px; border: 0;
           border-radius: 8px; background: #0d6efd; color: #fff; font-size: 1rem;
           text-decoration: none; cursor: pointer; }
    a.btn.alt { background: #e9ecef; color: #222; }
  </style>
</head>
<body>
  <div class="box">
    <h1>You're offline</h1>
    <p>This page isn't saved on your device yet. Pages and products you've already viewed are still available.</p>
    <button onclick="location.reload()">Try again</button>
    <a class="btn alt" href="/">Go to home</a>
  </div>
</body>
</html>
